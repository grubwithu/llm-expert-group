[project]
name = "llm-expert-group-backend"
version = "0.1.0"
description = "Human-in-the-loop multi-LLM expert council backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.0,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
